# FLOW IPTV relay — nginx serving HLS + API do VPS
server {
  listen 8080;
  root /opt/relay;

  location /api/ {
    alias /opt/relay/api/;
    default_type application/json;
    add_header Access-Control-Allow-Origin *;
  }

  location /hls/ {
    alias /opt/relay/hls/;
    types {
      application/vnd.apple.mpegurl m3u8;
      video/mp2t ts;
    }
    add_header Access-Control-Allow-Origin *;
  }
}
